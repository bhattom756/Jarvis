[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-backend"
version = "0.1.0"
description = "JARVIS FastAPI orchestration backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "qdrant-client>=1.10.0",
  "openai>=1.35.0",
  "pymongo>=4.8.0",
  "python-dotenv>=1.0.1",
  "faster-whisper>=1.1.0",
  "sounddevice>=0.5.1",
  "numpy>=1.26.0",
  "playwright>=1.49.0",
  "pyautogui>=0.9.54",
  "pygetwindow>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
